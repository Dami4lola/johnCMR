<!DOCTYPE html>
<html>
<head>
    <title>OBATEK - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
        <h3 class="text-center mb-3">Sign In to OBATEK</h3>
        <p class="text-center text-muted small mb-4">Workers & Managers</p>
        
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger">
                    Invalid username or password.
                </div>
            {% endif %}
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>

        <hr>
        <div class="text-center">
            <p>New worker?</p>
            <a href="{% url 'register' %}" class="btn btn-outline-secondary btn-sm">Create an Account</a>
        </div>
    </div>
</body>
</html>
