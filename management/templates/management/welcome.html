<!DOCTYPE html>
<html>
<head>
    <title>Welcome to OBATEK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #0099ff 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .welcome-card {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1 class="mb-3 fw-bold text-primary">OBATEK CRM</h1>
        <p class="text-muted mb-4">Manage tasks, log hours, and track jobs efficiently.</p>

        <div class="d-grid gap-3">
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                <strong>Sign In</strong>
                <br>
                <small class="opacity-75">Workers & Managers</small>
            </a>
            <hr class="my-2">
            <p class="text-muted small mb-2">New to OBATEK?</p>
            <a href="{% url 'register' %}" class="btn btn-outline-primary">Create Worker Account</a>
        </div>
    </div>
</body>
</html>
